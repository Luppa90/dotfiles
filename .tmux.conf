# --- General Settings ---

# Enable mouse mode (scrolling, pane selection, etc.)
set -g mouse on

# Set a much larger history limit (e.g., 100,000 lines)
set -g history-limit 100000

# Start window and pane numbering at 1, not 0.
set -g base-index 1
setw -g pane-base-index 1

# --- Keybindings ---

# Set prefix to Ctrl-a (more ergonomic than Ctrl-b)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Split panes using | and - for vertical and horizontal splits
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Reload config file with Prefix + r
bind r source-file ~/.tmux.conf \; display "Reloaded tmux config!"

# Disable the right-click context menu
# This allows for normal terminal copy/paste behavior with the mouse.
unbind-key -T copy-mode-vi MouseRightPane
